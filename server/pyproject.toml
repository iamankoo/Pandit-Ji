[project]
name = "pandit-server"
version = "0.1.0"
description = "FastAPI HTTP composition layer (ADR-007). Not one of the five canonical domain services."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.6,<3",
  "psycopg[binary]>=3.1,<4",
  "redis>=5.0,<6",
  "pandit-contracts",
  "pandit-shared",
  "pandit-astro-engine",
  "pandit-rule-engine",
  "pandit-agent",
  "pandit-knowledge",
  "pandit-verification",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
