[project]
name = "pandit-agent"
version = "0.2.0"
description = "Agent Orchestrator foundation plus the Phase 14 self-hosted LLM capability (pandit_agent.llm). No planner, narration or verification yet."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2",
  "jinja2>=3.1",
  "jsonschema>=4.20",
  "pandit-contracts",
  "pandit-shared",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-jsonschema>=4.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pandit_agent = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
