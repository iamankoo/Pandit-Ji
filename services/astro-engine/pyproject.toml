[project]
name = "pandit-astro-engine"
version = "0.8.0"
description = "Deterministic astronomical and chart calculation engine (Phase 4: Swiss Ephemeris-backed planetary positions, retrograde, combustion, sunrise/sunset, timezone conversion; Phase 5: Kundli -- Ascendant, houses, Rashi/Nakshatra placement, house lords, aspects, dignity, and the full Shodashvarga divisional-chart set; Phase 7: Vimshottari Dasha facts; Phase 8: transit / Gochar facts, ingress and station events and the Sade Sati sign-band timeline; Phase 9 WP-A1/A2/A3: Ashtakavarga Bhinna and Sarva facts across four independent source profiles, plus BPHS-only Trikona/Ekadhipatya Shodhana reductions and Pinda Sadhana; Phase 9 WP-B: Rashi Drishti, Chara Karaka and Constant Karaka; Phase 9 WP-C: Partial/Degree Drishti under two separate profiles; Phase 9 WP-D: Western tropical chart facts -- tropical positions including Uranus, Neptune and Pluto, Placidus houses, the five Ptolemaic aspects with explicit orb profiles and applying/separating state)."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6,<3",
  "pyswisseph>=2.10,<3",
  "tzdata>=2024.1",
  "pandit-contracts",
  "pandit-shared",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  # Test-only: the Shadbala drift test reads the locked Phase 6 YAML tables.
  "pyyaml>=6.0,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pandit_astro_engine = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
# pyswisseph is a C extension with no bundled type stubs (py.typed) upstream.
module = "swisseph"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
