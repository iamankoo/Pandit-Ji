[project]
name = "pandit-astro-engine"
version = "0.3.0"
description = "Deterministic astronomical and chart calculation engine (Phase 4: Swiss Ephemeris-backed planetary positions, retrograde, combustion, sunrise/sunset, timezone conversion; Phase 5: Kundli -- Ascendant, houses, Rashi/Nakshatra placement, house lords, aspects, dignity, and the full Shodashvarga divisional-chart set)."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6,<3",
  "pyswisseph>=2.10,<3",
  "tzdata>=2024.1",
  "pandit-contracts",
  "pandit-shared",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pandit_astro_engine = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
# pyswisseph is a C extension with no bundled type stubs (py.typed) upstream.
module = "swisseph"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
