# A source disagreement recorded by hand: it cannot be settled at translation level.
conflicts:
  - concept: HOUSE.02
    profiles: [KB_BPHS_SAN_HOUSE_SIGNIFICATION_11_2_13, KB_BPHS_SAN_HOUSE_SIGNIFICATION_32_31_33]
    note: >-
      Ch. 32 v. 32 as translated lists "wife" for the 2nd house; Ch. 11 v. 3 lists wealth, grains,
      family, death, enemies, metals and precious stones and no wife, and puts the wife at the 7th
      house (v. 8). The translator's own table in the Ch. 32 note gives "family, finance, wife etc."
      for the 2nd house. Unresolved without a Sanskrit-level review; neither reading is preferred.
