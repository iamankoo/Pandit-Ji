# Rule references, exceptions and strength references (Phase 12, KB-31 to KB-34).
#
# A reference points AT an existing deterministic rule or methodology profile; it never copies
# the rule's logic. The rule engine (and the astro-engine for profiles) stays the only place a
# rule is evaluated; knowledge only says where a rule lives and which concept it involves.
# Every `rule_id` below is checked against the rule YAML under `services/knowledge/rules/` by the
# loader, so a renamed or removed rule fails the build.
