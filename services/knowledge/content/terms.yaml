# Canonical terminology layer (Phase 12, KB-30). Only source-attested terms; nothing is invented,
# transliterated into Hinglish or translated by the project. No Hindi rendering is stored: no
# Hindi source was read in Phase 12, so every Hindi rendering is NOT_VERIFIED and absent.
#
# kinds: NAME = the source's own primary rendering; ALIAS = another name the same source gives.
# verification_status values (what was actually done):
#   TRANSLATION_READ_ON_PAGE_IMAGE      English translation read on the page image
#   TRANSLATION_READ_IN_OCR             English translation read in OCR only
#   SANSKRIT_READ_ON_PAGE_IMAGE_UNREVIEWED  Devanagari read on the page image by a non-qualified
#                                       reader; never a Sanskrit-level verification
#   TRANSLITERATION_READ_IN_OCR_UNREVIEWED  the translator's Roman transliteration read in OCR
concepts:
  - {id: TERM.GRAHA, key: graha, type: TERM}
  - {id: TERM.NAKSHATRA, key: nakshatra, type: TERM}
  - {id: TERM.RASI, key: rasi, type: TERM}
  - {id: TERM.LAGNA, key: lagna, type: TERM}
  - {id: TERM.BHAVA, key: bhava, type: TERM}

