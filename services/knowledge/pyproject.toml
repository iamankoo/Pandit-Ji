[project]
name = "pandit-knowledge"
version = "0.2.0"
description = "Structured + unstructured astrology knowledge, versioned ingestion and provenance-preserving retrieval (Phase 12)."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6,<3",
  "pyyaml>=6,<7",
  "pandit-contracts",
  "pandit-shared",
]

[project.optional-dependencies]
# PostgreSQL + pgvector store (the migration lives in infrastructure/migrations).
postgres = [
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
]
# Optional local semantic embedding model (Phase 14 owns the final model choice).
embeddings = [
  "sentence-transformers>=3",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
  "alembic>=1.13,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pandit_knowledge = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Long SQL literals in the database tests read better unbroken.
"tests/test_postgres.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres: needs a PostgreSQL + pgvector database (KNOWLEDGE_TEST_DATABASE_URL); skipped otherwise",
  "semantic_model: needs a local sentence-transformers model; skipped when it is not available",
]
