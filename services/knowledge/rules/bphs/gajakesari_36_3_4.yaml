readings:
- reading_id: EXCLUSIONS_ON_JUPITER_ENEMY_SIGN_NATURAL
  basis: translation
  note: Jupiter in an angle from the Ascendant or from the Moon, conjunct or aspected by another natural
    benefic; not debilitated, combust or in an inimical sign for Jupiter; an inimical sign is one whose
    lord is a natural enemy.
  conditions:
    op: all
    args:
    - op: any
      args:
      - op: planet_house
        planet: jupiter
        reference: lagna
        houses:
        - 1
        - 4
        - 7
        - 10
      - op: planet_house
        planet: jupiter
        reference: moon
        houses:
        - 1
        - 4
        - 7
        - 10
    - op: exists
      over: &id001
        nature: benefic
        exclude:
        - jupiter
      where:
        op: any
        args:
        - op: same_sign
          a: jupiter
          b: $it
        - op: aspected_by
          planet: jupiter
          by: $it
    - op: all
      args:
      - op: not
        arg:
          op: planet_dignity
          planet: jupiter
          in:
          - debilitated
      - op: not
        arg:
          op: planet_flag
          planet: jupiter
          flag: combust
      - op: not
        arg:
          op: sign_lord_relation
          planet: jupiter
          basis: natural
          kinds:
          - enemy
