readings:
- reading_id: TRANSLATION_12_4_7_8
  basis: translation
  note: 'The English translation: Mars in the 12th, 4th, 7th or 8th from the Ascendant, neither aspected
    by nor associated with any benefic.'
  conditions:
    op: all
    args:
    - op: planet_house
      planet: mars
      reference: lagna
      houses:
      - 4
      - 7
      - 8
      - 12
    - &id001
      op: for_all
      over:
        nature: benefic
      where:
        op: all
        args:
        - op: not
          arg:
            op: same_sign
            a: mars
            b: $it
        - op: not
          arg:
            op: aspected_by
            planet: mars
            by: $it
- reading_id: SANSKRIT_LAGNE_12_4_7_8
  basis: sanskrit_reading
  note: 'The Devanagari of v. 47 as read (unreviewed) names the Lagna as well: lagne vyaye sukhe vapi
    saptame vashtame kuje.'
  conditions:
    op: all
    args:
    - op: planet_house
      planet: mars
      reference: lagna
      houses:
      - 1
      - 4
      - 7
      - 8
      - 12
    - *id001
