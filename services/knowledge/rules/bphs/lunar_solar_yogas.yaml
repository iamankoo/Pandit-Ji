document_type: rule
rule_id: BPHS_SAN_KEMADRUMA_37_11_13
rule_version: '1'
astrology_system: vedic_parashari
school: parashari
profile: BPHS_SAN_KEMADRUMA_37_11_13
category: yoga
source: Brihat Parasara Hora Sastra
source_id: BPHS_SANTHANAM_1984
source_edition: Ranjan Publications, New Delhi, Vol I (Ch. 1-45)
translator: R. Santhanam
source_version: 1984 (Vol I)
source_tier: 2
source_location: Ch. 37 v. 11-13
verification_level: OCR-TRANSLATION
standards_version: 1.4.0
confidence: MEDIUM
status: active
priority: 100
conflict_group: KEMADRUMA_TOPIC
ambiguity_group: KEMADRUMA_SUN_SCOPE
readings:
- reading_id: SUN_EXCLUDED_FROM_EVERY_CLAUSE
  basis: translation
  note: 'Excluding the Sun everywhere: no planet with the Moon, in the 2nd or 12th from it, or in an angle
    from the Ascendant. The Moon is the reference and is not counted as a planet in any clause.'
  conditions:
    op: all
    args:
    - &id002
      op: all
      args:
      - op: not
        arg:
          op: exists
          over: &id001
            exclude:
            - sun
            - moon
            nodes: unspecified
          where:
            op: same_sign
            a: $it
            b: moon
      - op: not
        arg:
          op: exists
          over: *id001
          where:
            op: planet_house
            planet: $it
            reference: moon
            houses:
            - 2
            - 12
    - op: not
      arg:
        op: exists
        over: *id001
        where:
          op: planet_house
          planet: $it
          reference: lagna
          houses:
          - 1
          - 4
          - 7
          - 10
- reading_id: SUN_EXCLUDED_ONLY_FROM_MOON_CLAUSES
  basis: translation
  note: The Sun is excluded only from the Moon-relative clauses; a Sun in an angle from the Ascendant
    still counts.
  conditions:
    op: all
    args:
    - *id002
    - op: not
      arg:
        op: exists
        over:
          exclude:
          - moon
          nodes: unspecified
        where:
          op: planet_house
          planet: $it
          reference: lagna
          houses:
          - 1
          - 4
          - 7
          - 10
dependencies:
- dependency_id: NO_CANCELLATION_IN_THIS_EDITION
  kind: source_gap
  owner_phase: 6
  reason: not_specified_by_source
  unresolved_effect: informational
  description: This edition gives no cancellation for Kemadruma; the Phaladeepika tradition is a separate
    profile.
interpretation_tags:
  domain:
  - general
  signification:
  - yoga.kemadruma_37_11_13
  effect_class: challenging
