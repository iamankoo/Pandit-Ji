readings:
- reading_id: SL5
  basis: translation
  note: No planet other than the Sun in the 2nd or 12th from the Moon (the absence of Sunapha, Anapha
    and Duradhara).
  conditions:
    op: all
    args:
    - op: not
      arg:
        op: exists
        over: &id001
          exclude:
          - sun
          - moon
          nodes: unspecified
        where:
          op: planet_house
          planet: $it
          reference: moon
          houses:
          - 2
    - op: not
      arg:
        op: exists
        over: *id001
        where:
          op: planet_house
          planet: $it
          reference: moon
          houses:
          - 12
cancellations:
- cancellation_id: MOON_ASSOCIATED_WITH_A_PLANET
  when:
    op: exists
    over:
      exclude:
      - moon
      nodes: unspecified
    where:
      op: same_sign
      a: $it
      b: moon
  effect: full
  source_location: Adhyaya VI sloka 5 ("some declare")
  note: Some declare there is no Kemadruma where the Moon is associated with a planet.
- cancellation_id: PLANET_IN_KENDRA_FROM_MOON
  when:
    op: exists
    over:
      exclude:
      - moon
      nodes: unspecified
    where:
      op: planet_house
      planet: $it
