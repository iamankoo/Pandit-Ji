[project]
name = "pandit-rule-engine"
version = "0.9.0"
description = "Deterministic astrology rule evaluation engine (Phase 6: source-profile rules, ambiguity-preserving evaluation, evidence bundle; Phase 7: Dasha evidence)."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6,<3",
  "pyyaml>=6.0,<7",
  "pandit-contracts",
  "pandit-shared",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pandit_rule_engine = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
